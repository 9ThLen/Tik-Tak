name: research

on:
  push:
    branches: ["**"]
    paths:
      - "research/**"
      - "tools/parity/**"
      - "core/**"
      - ".github/workflows/research.yml"
  pull_request:
    paths:
      - "research/**"
      - "tools/parity/**"
      - "core/**"
      - ".github/workflows/research.yml"

permissions:
  contents: read

jobs:
  test:
    name: python tests and C++ parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/pyproject.toml

      - name: Install Python dependencies
        run: python -m pip install -e "research[test]"

      - name: Run Python tests
        working-directory: research
        run: python -m pytest -q

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure parity tools
        run: >
          cmake -S tools/parity -B tools/parity/build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DTIKTAK_WERROR=ON

      - name: Build parity tools
        run: cmake --build tools/parity/build

      - name: Compare C++ against the Python reference
        run: python tools/parity/check_parity.py
