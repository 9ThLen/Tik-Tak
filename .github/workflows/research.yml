name: research

on:
  push:
    branches: ["**"]
    paths:
      - "research/**"
      - "tools/parity/**"
      - "tools/eval/**"
      - "core/**"
      - ".github/workflows/research.yml"
  pull_request:
    paths:
      - "research/**"
      - "tools/parity/**"
      - "tools/eval/**"
      - "core/**"
      - ".github/workflows/research.yml"

permissions:
  contents: read

jobs:
  test:
    name: python tests and C++ parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/pyproject.toml

      - name: Install Python dependencies
        run: python -m pip install -e "research[test]"

      - name: Run Python tests
        working-directory: research
        run: python -m pytest -q

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure parity tools
        run: >
          cmake -S tools/parity -B tools/parity/build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DTIKTAK_WERROR=ON

      - name: Build parity tools
        run: cmake --build tools/parity/build

      - name: Compare C++ against the Python reference
        run: python tools/parity/check_parity.py

      - name: Configure the analysis dump
        run: >
          cmake -S tools/eval -B tools/eval/build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DTIKTAK_WERROR=ON

      - name: Build the analysis dump
        run: cmake --build tools/eval/build

      # A regression signal on synthetic clips, not a calibration: they have no
      # chord changes, so the harmony cue is not exercised, and the margin
      # threshold must be chosen on real recordings. Ten of the thirteen clips
      # currently come back with the right metre and phase; the three that do
      # not are named in research/eval/README.md.
      - name: Score the bar lines
        working-directory: research
        run: python -m eval.downbeat_benchmark --expect-correct 10
